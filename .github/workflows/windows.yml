name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run --once
        run: ./target/release/timechopper.exe --once

      - name: Smoke test (Notepad)
        shell: pwsh
        run: ./ci/smoke-notepad.ps1

      - name: Smoke test (Calculator, UWP)
        shell: pwsh
        run: ./ci/smoke-calculator.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: timechopper-windows
          path: target/release/timechopper.exe
