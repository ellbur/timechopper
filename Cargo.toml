[package]
name = "timechopper"
version = "0.1.0"
edition = "2024"
description = "Watch the focused window on Windows and work out what was being worked on"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "wgpu", "x11", "wayland", "accesskit"] }

[dev-dependencies]
egui_kittest = "0.37"
